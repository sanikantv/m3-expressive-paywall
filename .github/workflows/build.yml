# Build template for sanikantv M3 Expressive repos.
#
# - Every push / PR to main: assemble the debug APK and upload it as a workflow artifact.
# - Every tag v*: also create a GitHub Release with the APK attached.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.name.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build library and demo APK
        run: ./gradlew :paywall:assembleRelease :paywall:publishToMavenLocal :app:assembleDebug --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :paywall:lintRelease :app:lintDebug --no-daemon

      - name: Name the APK after the repo and ref
        id: name
        run: |
          REF="${GITHUB_REF_NAME//\//-}"
          NAME="${GITHUB_REPOSITORY##*/}-${REF}.apk"
          cp "$APK_PATH" "$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk_name }}
          path: ${{ steps.name.outputs.apk_name }}
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.build.outputs.apk_name }}
          generate_release_notes: true
