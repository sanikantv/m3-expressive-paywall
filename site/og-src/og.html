<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph card</title>
<!-- Rendered to public/og/*.png (1200x630) by scripts/render-og.sh. ?section=home|components|guides|docs -->
<style>
  @font-face {
    font-family: "Google Sans Flex";
    src: url("../../app/src/main/res/font/google_sans_flex.ttf") format("truetype");
    font-weight: 1 1000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Google Sans Flex", system-ui, sans-serif; background: #FEF7FF; color: #1D1B20; position: relative; }
  .copy { position: absolute; left: 72px; top: 76px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; color: #4F378B; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; }
  .kicker { margin-top: 56px; font-size: 24px; font-weight: 600; color: #6750A4; letter-spacing: .5px; text-transform: uppercase; }
  h1 { font-size: 64px; line-height: 1.04; margin: 12px 0 20px; font-weight: 700; letter-spacing: -1px; }
  p { font-size: 26px; line-height: 1.35; margin: 0; color: #49454F; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 22px; color: #6750A4; font-weight: 600; }
  .phones { position: absolute; right: 48px; top: 40px; width: 460px; height: 600px; }
  .phone { position: absolute; width: 230px; border-radius: 28px; border: 6px solid #1D1B20; box-shadow: 0 24px 48px rgba(29,27,32,.22); }
  .p1 { left: 0; top: 60px; transform: rotate(-6deg); }
  .p2 { left: 200px; top: 0; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../art/icon/icon-rounded-512.png" alt="">M3 Expressive Paywall</div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p id="text"></p>
  </div>
  <div class="url">paywall.sanikant.dev</div>
  <div class="phones">
    <img class="phone p1" id="s1" alt="">
    <img class="phone p2" id="s2" alt="">
  </div>
  <script>
    const sections = {
      home: ['Jetpack Compose', 'Material 3 Expressive paywalls', 'Six subscription screens. Google Play disclosures built in. Bring your own billing.', '01-classic-light', '04-picker-dark'],
      components: ['Paywall designs', 'Six ready-to-use paywalls', 'Classic plans, Free vs Pro, trial timeline, plan picker, limited offer, onboarding.', '02-comparison-light', '03-trial-dark'],
      guides: ['Guides', 'Build better Compose paywalls', 'Google Play rules, Play Billing, RevenueCat, countdowns, shape morphing and more.', '05-offer-light', '06-onboarding-dark'],
      docs: ['Docs', 'M3 Expressive Paywall docs', 'Install, API, FAQ and changelog for the Jetpack Compose paywall templates.', '01-classic-dark', '04-picker-light'],
    };
    const [k, t, x, a, b] = sections[new URLSearchParams(location.search).get('section') || 'home'];
    document.getElementById('kicker').textContent = k;
    document.getElementById('title').textContent = t;
    document.getElementById('text').textContent = x;
    document.getElementById('s1').src = `../../art/screenshots/${a}.png`;
    document.getElementById('s2').src = `../../art/screenshots/${b}.png`;
  </script>
</body>
</html>
